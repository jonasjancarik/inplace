[project]
name = "inplace-html"
version = "0.1.0"
description = "Edit an HTML document in the browser while an agent edits the same file."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
inplace = "inplace.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/inplace"]
